[project]
name = "multi-stage-detection-pipeline"
version = "0.0.01"
description = ""
authors = [
    {name = "zoey.parsley026"},
]
dependencies = [
    "customtkinter",
    "docopt",
    "matplotlib",
    "numpy<2.0",
    "opencv-python>=4.11.0.86",
    "onnxruntime",          
    "pandas",
    "Pillow",
    "protobuf",
    "PyYAML",
    "requests",
    "scipy",
    "seaborn",
    "tensorboard",
    "torch==2.0.0",
    "torchvision==0.15.1",
    "torchaudio==2.0.1",
    "tqdm>=4.67.1",
    "pydantic>=2.0",
    "typing-extensions>=4.16.0",
]

requires-python = ">=3.10, <3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

classifiers = [
  "Private :: Do Not Upload"
]

[[tool.pdm.source]]
name = "private"
url = "https://download.pytorch.org/whl/cpu"
include_packages = ["torch", "torchvision", "torchaudio"]
exclude_packages = ["*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --strict-markers -ra"
markers = [
    "unit: deterministic tests using synthetic data or mocked model backends",
    "integration: tests requiring local model files or saved reference arrays",
    "requires_files(*paths): skip when specified repository-relative assets are absent",
]
